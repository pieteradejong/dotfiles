# skiplist.example.conf — the SHAPE of the skip list. The real one names repos,
# so it lives at dotfiles/private/audit/skiplist.conf (private companion repo).
# dev-audit.sh refuses to run without it; set SKIPLIST_FILE to override.
#
# Format:  <mode>:<repo-name>:<reason>
#   skip:  excluded from the audit entirely. No git command is ever run in it.
#          Use only when touching the repo at all is the problem.
#   fork:  someone else's code. Excluded from POLICY checks (licensing,
#          .gitignore shape, CI presence) because a fork is never relicensed or
#          reshaped. Still gets git-hygiene, privacy and disk checks, which are
#          about this machine, not upstream's choices.
#   own:   ours, although its GitHub owner is an org rather than pieteradejong.
#          A repo under another owner is skipped by the policy checks like a
#          fork (D44); this row keeps it in them.
#
# Names are the directory basename, not the GitHub slug.

# --- skip -------------------------------------------------------------------
skip:example-do-not-touch:do-not-touch (reason)

# --- forks and upstream clones ----------------------------------------------
fork:example-upstream-clone:fork, upstream license kept as-is

# --- ours under an org -------------------------------------------------------
own:example-org-repo:ours, lives under an org
