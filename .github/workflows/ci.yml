# dotfiles CI. This repo is PUBLIC; its private companion lives at private/ on
# disk only. These jobs are the server-side layer behind the local gate:
#
#   security       full-history gitleaks + the gate in ci mode over what was pushed
#                  (the same reusable workflow every other repo calls)
#   security-prev  the same, under the previous tip's rules (D56)
#   private-guard  private/ must never be tracked, nor any submodule/gitlink
#   tests          ./test.sh — gate, guard hook, sweep, audit, dotaudit, shellcheck, ruff, docs

name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly full sweep, Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security-reusable.yml
    with:
      policy-ref: ${{ github.sha }}

  # The same check under the PREVIOUS rules, so a commit that weakens gate.sh,
  # patterns.sh or gitleaks.toml is still judged by the rules it replaces (D56).
  # Previous = the PR base, else the pre-push tip, else main (new branch,
  # schedule, dispatch). It cannot cover an edit to this file or to the
  # reusable workflow itself; only a required status check on main does.
  security-prev:
    uses: ./.github/workflows/security-reusable.yml
    with:
      policy-ref: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'main' }}

  private-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: private/ is not tracked, and no gitlinks exist
        run: |
          set -euo pipefail
          if git ls-tree -r --name-only HEAD | grep -qE '^private(/|$)'; then
            echo "::error::private/ is tracked in HEAD — the private companion repo must never enter public dotfiles"; exit 1
          fi
          if git ls-tree -r HEAD | awk '$1 == "160000"' | grep -q .; then
            echo "::error::a gitlink (submodule) is tracked — not allowed in this repo"; exit 1
          fi
      - name: private/ never appeared in any commit (full history)
        run: |
          set -euo pipefail
          if git log --all --format= --name-only | grep -qE '^private(/|$)'; then
            echo "::error::private/ appears in history — treat as published and follow the leak procedure"; exit 1
          fi

  tests:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: brew install git gitleaks shellcheck jq ruff pre-commit
      - name: Run all tests
        run: |
          export PATH="$(brew --prefix)/bin:$PATH"
          git config --global user.name ci
          git config --global user.email ci@users.noreply.github.com
          ./test.sh
